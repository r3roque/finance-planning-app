<title>Finance Planning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a personal ledger. Five views (Month, Year, Plan, Bills, Income); summary band first, detail below, one add button in reach. */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --sunk:#E2E9E6; --line:#D2DCD8; --remain:#C9D6D1;
  --ink:#122220; --muted:#5A6B67; --accent:#0E6B57; --accent-ink:#FFFFFF; --accent-soft:#D5EAE3;
  --danger:#B42318; --danger-soft:#FBE3E0; --good:#1E7A44;
  --shadow:0 1px 2px rgba(18,34,32,.06),0 8px 24px rgba(18,34,32,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#15201D; --sunk:#1C2925; --line:#27362F; --remain:#2E3F39;
  --ink:#E3ECE8; --muted:#94A6A0; --accent:#47C9A2; --accent-ink:#06231C; --accent-soft:#163A30;
  --danger:#F2826F; --danger-soft:#3A1C18; --good:#5CCB8A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#15201D; --sunk:#1C2925; --line:#27362F; --remain:#2E3F39;
  --ink:#E3ECE8; --muted:#94A6A0; --accent:#47C9A2; --accent-ink:#06231C; --accent-soft:#163A30;
  --danger:#F2826F; --danger-soft:#3A1C18; --good:#5CCB8A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
h2,h3{text-wrap:balance}

header.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0}
.brand span{color:var(--muted);font-size:13px}
.tabscroll{max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabscroll::-webkit-scrollbar{display:none}
/* Tabs stay visible while scrolling. Desktop: the whole header sticks. Phone: only the tab bar sticks. */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top,.tabscroll.bleed{background:var(--bg);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid transparent;transition:border-color .15s}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
body.scrolled header.top{border-bottom-color:var(--line)}
@media (max-width:700px){
  /* Phone: tabs become a bottom bar */
  header.top{position:static;border-bottom:0}
  .tabscroll{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:9;max-width:none;overflow:visible;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(18,34,32,.06)}
  .tabscroll .tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;background:none;padding:0;border-radius:0}
  .tabscroll .tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;border-radius:10px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
  .tabscroll .tabs a span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabscroll .tabs a .ti{display:block;width:24px;height:24px;padding:2px 10px;box-sizing:content-box;border-radius:999px}
  .tabscroll .tabs a[aria-current="page"]{background:none;box-shadow:none;color:var(--accent)}
  .tabscroll .tabs a[aria-current="page"] .ti{background:var(--accent-soft)}
  body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  body .fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  body .editfab{bottom:calc(142px + env(safe-area-inset-bottom,0px))}
  body .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
}
.tabs .ti{display:none}
@media (max-width:360px){.tabscroll .tabs a{font-size:10px;letter-spacing:-.01em}.tabscroll .tabs a .ti{padding:2px 6px}}
.tabs{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;white-space:nowrap}
.tabs a{padding:6px 13px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.nav{display:flex;align-items:center;gap:6px;margin-block:8px 14px;flex-wrap:wrap}
.nav h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0 6px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 6px}
.pagehead{margin-block:10px 14px}
.pagehead h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:65ch}

.summary{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:14px}
.summary .lead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,8vw,46px);letter-spacing:-.02em;line-height:1}
.neg{color:var(--danger)}
.pos{color:var(--good)}
.stats{display:flex;gap:10px 22px;flex-wrap:wrap}
.stat b{display:block;font-weight:600;font-size:17px}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.meter i.over{background:var(--danger)}
.hint{color:var(--muted);font-size:13px}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:18px}
@media (min-width:860px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.panel{min-width:0}
.panel>h3,.card>h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}

.cats{display:grid;gap:2px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:6px}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px;border-radius:8px;background:none;border:0;text-align:left;width:100%}
.catrow:hover{background:var(--sunk)}
.catrow.active{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.catrow .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .amt{font-weight:600;text-align:right}
.catrow .sub{grid-column:2 / 4;display:flex;align-items:center;gap:10px}
.catrow .sub .meter{flex:1;height:6px}
.catrow .sub small{color:var(--muted);font-size:12px;white-space:nowrap}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.pill.over{background:var(--danger-soft);color:var(--danger)}
.pill.rec{background:var(--accent-soft);color:var(--accent)}
.pill.auto{background:var(--sunk);color:var(--muted)}

.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.exp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.exp:last-child{border-bottom:0}
.exp:hover{background:var(--sunk)}
.exp .day{grid-row:1 / 3;width:38px;text-align:center;line-height:1.1}
.exp .day b{display:block;font-family:var(--f-display);font-size:19px}
.exp .day small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.exp .title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;flex-wrap:wrap}
.exp .val{grid-row:1 / 3;grid-column:3;font-weight:600;font-size:16px;text-align:right}
.empty{padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:17px;margin-bottom:4px}

.due{display:grid;gap:8px}
.duerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.duerow .nm{flex:1;min-width:140px;font-weight:600}

.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;z-index:5}

/* inputs */
.field{display:grid;gap:6px;align-content:start;min-width:0}
.field>label{font-weight:600;font-size:14px}
input[type=text],input[type=date],input[type=email],input[type=password],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 11px;width:100%;min-width:0;height:40px;line-height:normal;font-size:15px;display:block;margin:0}
input[type=date]{-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
input:focus,select:focus{border-color:var(--accent);outline:none}
.money,.pct{position:relative;min-width:0}
.money::before{content:"$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.money input{padding-left:21px}
.pct::after{content:"%";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.pct input{padding-right:24px}
input.r{text-align:right}
.chk{width:20px;height:20px;accent-color:var(--accent);margin:0}
.btn{border-radius:8px;padding:9px 14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.delbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted);font-size:17px;flex:none}
.delbtn:hover{color:var(--danger);border-color:var(--danger)}
.delbtn.arm{width:auto;padding:0 10px;background:var(--danger);color:#fff;border-color:var(--danger);font-size:13px;font-weight:600}

/* editable rows */
.rows{display:grid;gap:8px}
.erow{display:grid;gap:8px;align-items:center}
.erow .ro{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.erow .sub2{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-left:0}
.erow .sub2 .field{grid-template-columns:auto;min-width:120px;flex:1}
.erow.off input[type=text]{opacity:.55}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.colhead{display:grid;gap:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addrow input,.addrow select{flex:1;min-width:150px;width:auto}
.lines{--c:26px minmax(0,1fr) 160px 120px 92px}
.lines>.erow,.lines>.colhead{grid-template-columns:var(--c)}
/* Plan lines: each line is its own band, separated by rules */
.lines{gap:0}
.lines>.colhead{padding-bottom:6px}
.lines>.erow{padding:10px 0;border-top:1px solid var(--line);row-gap:6px}
.lines>.erow .sub2{padding-left:34px;min-height:40px;align-items:center}
.lines>.erow>input[type=text]{font-weight:600}
@media (max-width:520px){
  .hide-sm{display:none}
  .lines>.colhead{display:none}
  .lines{--c:26px minmax(0,1fr) minmax(0,1fr)}
  .lines>.erow{padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);row-gap:8px;column-gap:8px}
  .lines>.erow>.chk{grid-row:1;grid-column:1}
  .lines>.erow>input[type=text]{grid-row:1;grid-column:2 / 4}
  .lines>.erow>.freqcell{grid-row:2;grid-column:2}
  .lines>.erow>.money{grid-row:2;grid-column:3}
  .lines>.erow>.sub2{grid-row:3;grid-column:2 / 4;padding-left:0}
  .lines>.erow>.billsave{grid-row:4;grid-column:2 / 4;padding-left:0}
  .lines>.erow:has(>.billsave)>.lineact{grid-row:5}
  .lines>.erow>.lineact{grid-column:2 / 4;justify-content:flex-end;padding-top:6px;border-top:1px dashed var(--line)}
}
.billrows{--c:26px minmax(0,1fr) 120px 40px}
.billrows>.erow{grid-template-columns:var(--c)}
.billrows>.erow{padding-block:10px;border-bottom:1px solid var(--line)}
.billrows>.erow:last-child{border-bottom:0}
.billrows .sub2{padding-left:34px}
.arrows{display:inline-flex;gap:4px}
.arrows .delbtn{font-size:16px}
.delbtn:disabled{opacity:.35;cursor:default;color:var(--muted);border-color:var(--line)}
.lineact{display:inline-flex;gap:4px;justify-content:flex-end}
.editing .lines{--c:26px minmax(0,1fr) 160px 120px 92px 132px}
@media (max-width:520px){.editing .lines{--c:26px minmax(0,1fr) minmax(0,1fr)}}
.catedit{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;padding:6px 8px;background:var(--bg);border-radius:8px}
.dedrows>.erow,.dedrows>.colhead{grid-template-columns:minmax(0,1fr) 120px 40px}
.bonrows>.erow,.bonrows>.colhead{grid-template-columns:minmax(0,1fr) 120px 40px}
.taxrows>.erow,.taxrows>.colhead{grid-template-columns:minmax(0,1fr) 120px 40px}
.taxrows>.erow{padding-bottom:8px;border-bottom:1px solid var(--line)}
.taxrows>.erow:last-child{border-bottom:0}
.bracketrows>.erow,.bracketrows>.colhead{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 92px 40px}

details.subtot>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;padding:8px 0;border-top:1px solid var(--line)}
details.subtot>summary::-webkit-details-marker{display:none}
details.subtot .arrow{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:16px;line-height:1;transition:transform .15s}
details.subtot[open] .arrow{transform:rotate(90deg)}
details.subtot table{min-width:0}
details.subtot th{white-space:normal}
@media (max-width:520px){.dedrows>.erow,.dedrows>.colhead,.taxrows>.erow,.taxrows>.colhead,.bonrows>.erow,.bonrows>.colhead{grid-template-columns:minmax(0,1fr) 104px 40px}details.subtot td,details.subtot th{padding-inline:4px}}
button.pcfold{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left}
.pcfold .pcname{font-family:var(--f-display);font-weight:500;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcfold small{display:block;white-space:normal;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.pcfold .pcnet{text-align:right;font-weight:600}
@media (max-width:520px){button.pcfold{grid-template-columns:auto minmax(0,1fr) auto}.pcfold .pill{display:none}}
.pcfold .arrow,.pcfold-btn .arrow{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunk);font-size:17px;line-height:1;transition:transform .15s}
.pcfold-btn{background:none;border:0;padding:0;display:grid;place-items:center}
.arrow.open{transform:rotate(90deg)}
/* bank import */
.csvlist{display:grid}
.csvrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(150px,200px) 110px;gap:6px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.csvrow:last-child{border-bottom:0}
.csvrow.off .cdesc b,.csvrow.off .camt{opacity:.5}
.csvrow .cdesc{min-width:0;display:grid;gap:2px}
.csvrow .cdesc b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csvrow .cdesc small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.csvrow .camt{font-weight:600;text-align:right;grid-column:4;grid-row:1}
.csvrow .ccat{display:flex;align-items:center;gap:8px;grid-column:3;grid-row:1;min-width:0}
.csvrow .ccat select{height:36px;font-size:14px}
@media (max-width:620px){.csvrow{grid-template-columns:26px minmax(0,1fr) auto}.csvrow .camt{grid-column:3}.csvrow .ccat{grid-column:2 / 4;grid-row:2;flex-wrap:wrap}.csvrow .ccat select{flex:1;min-width:0}}
.exphead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:10px 4px}
.exphead h2{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;justify-self:start}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.setgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:860px){.setgrid{grid-template-columns:200px minmax(0,1fr)}}
.setnav{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:calc(96px + env(safe-area-inset-top,0px))}
.setnav button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
.setnav button:hover{background:var(--sunk);color:var(--ink)}
@media (max-width:859px){.setnav{display:none}}
.setsec{display:grid;gap:10px;scroll-margin-top:100px}
.setsec>h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.setsec>p.hint{margin:-4px 0 2px;max-width:65ch}
.firstpaid{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
.firstpaid .hint{white-space:nowrap}
.addrow .firstpaid input{min-width:150px}
.efund{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.efund h3{font-family:var(--f-display);font-weight:500;font-size:18px}
.efval{text-align:right}
.goals{margin-top:18px;display:grid;gap:12px}
.goalshead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.goalshead h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0}
.goal{gap:10px}
.goalhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goalhead h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0;overflow-wrap:anywhere}
.goalright{display:flex;align-items:center;gap:10px;flex:none}
.cbox .two{gap:10px}
.efprog{flex:1 1 100%;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.efrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.efpct{text-align:right}

<script id="logic">

var CH = (function(){
const PERIODS={weekly:{label:'Weekly',ppm:52/12},biweekly:{label:'Every 2 weeks',ppm:26/12},semimonthly:{label:'Twice a month',ppm:2},monthly:{label:'Monthly',ppm:1},once:{label:'One time',ppm:0}};

const freqOf=l=>FREQ[l.freq]?l.freq:'monthly';
const everyToFreq=e=>({1:'monthly',2:'m2',3:'m3',4:'m4',6:'m6',12:'yearly'})[+e]||'yearly';

const uid=()=> (typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now().toString(36)+(++_n)+Math.random().toString(36).slice(2,8));

  {id:'housing',name:'Housing',color:'#2F6F8F',bucket:'need'},

    if(c==='"'&&f.trim()===''){q=true;f='';continue;}

        const rows=this.ok(await sb.from('expenses').select('id,data').eq('user_id',uid).order('id').range(from,from+999)).data||[];
        rows.forEach(r=>{exp[r.id]=r.data;});if(rows.length<1000)break;
      }

      else if(row&&row.data&&Object.keys(row.data).length){const m=migrate(clone(row.data));S.cfg=m.cfg;}
      else{S.cfg=normalize(defaults());this.saveSettings();}

      setStatus('Saved to your account. Only you can see this data.');
      render();

    }catch(e){console.warn(e);setStatus('Could not load your data. Check your connection and reload the page.');if(!quiet)toast('Could not load your data.');}
  },
  async cloudBatch(rows,size,fn,onProgress){

      for(let t=0;t<5&&!ok;t++){try{this.ok(await fn(part));ok=true;}catch(e){console.warn(e);await sleep(400*Math.pow(2,t));}}

  local(){

  },
  persistLocal(){try{localStorage.setItem(LS,JSON.stringify({cfg:S.cfg,expenses:S.expenses}));}catch(e){toast('Could not save in this browser.');}},
  applyRemap(remap){if(!remap)return;for(const [id,e] of Object.entries(S.expenses))if(e&&remap[e.categoryId])this.putExpense(id,{...e,categoryId:remap[e.categoryId]});},
  remote(db,id){

    let gotS=false,gotE=false,pendingRemap=null;

    const ready=()=>{if(gotS&&gotE&&!S.ready){S.ready=true;setStatus('Synced to your Claude account. Only you can see this data.');}
      if(gotE&&pendingRemap){const r=pendingRemap;pendingRemap=null;this.applyRemap(r);}};

  q(key,fn){const p=(this.chain[key]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete some old expenses and try again.':'A change did not save. Check your connection and try again.');});this.chain[key]=p;return p;},
  saveSettings(){

      if(!this.uid)return Promise.resolve();

        try{this.ok(await this.sb.from('user_settings').upsert({user_id:this.uid,data:b,updated_at:new Date().toISOString()}));}
        finally{if(this.pendingSettings===b)this.pendingSettings=null;}});
    }

    this.pendingSettings=clone(S.cfg);

  },
  putExpense(id,data){S.expenses[id]=data;

    if(this.mode!=='remote'){this.persistLocal();return Promise.resolve();}return this.q('e:'+id,()=>this.expCol.doc(id).set(data));},
  deleteExpense(id){delete S.expenses[id];
    if(this.mode==='cloud')return this.q('e:'+id,async()=>this.ok(await this.sb.from('expenses').delete().eq('user_id',this.uid).eq('id',id)));
    if(this.mode!=='remote'){this.persistLocal();return Promise.resolve();}return this.q('e:'+id,()=>this.expCol.doc(id).delete());},
  // Bulk write with backoff, for imports.
  async bulkDelete(ids,onProgress){
    if(this.mode==='cloud'){ids.forEach(id=>delete S.expenses[id]);return this.cloudBatch(ids,200,part=>this.sb.from('expenses').delete().eq('user_id',this.uid).in('id',part),onProgress);}
    if(this.mode!=='remote'){ids.forEach(id=>delete S.expenses[id]);this.persistLocal();onProgress&&onProgress(ids.length);return 0;}
    let done=0,failed=0;
    for(const id of ids){
      delete S.expenses[id];let ok=false;
      for(let t=0;t<6&&!ok;t++){
        try{await this.expCol.doc(id).delete();ok=true;}
        catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable'))await sleep(400*Math.pow(2,t)+Math.random()*200);else break;}
      }
      if(!ok)failed++;done++;if(onProgress&&(done%5===0||done===ids.length))onProgress(done);
    }
    return failed;
  },
  async bulkPut(items,onProgress){
    if(this.mode==='cloud'){const now=new Date().toISOString();items.forEach(([id,d])=>S.expenses[id]=d);return this.cloudBatch(items,200,part=>this.sb.from('expenses').upsert(part.map(([id,d])=>({user_id:this.uid,id,data:d,updated_at:now}))),onProgress);}
    if(this.mode!=='remote'){items.forEach(([id,d])=>S.expenses[id]=d);this.persistLocal();onProgress(items.length);return 0;}
    let done=0,failed=0;
    for(const [id,d] of items){
      S.expenses[id]=d;let ok=false;
      for(let t=0;t<6&&!ok;t++){
        try{await this.expCol.doc(id).set(d);ok=true;}
        catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable'))await sleep(400*Math.pow(2,t)+Math.random()*200);else break;}
      }
      if(!ok)failed++;done++;if(done%5===0||done===items.length)onProgress(done);
    }
    return failed;
  }
};

  ['Chase','Open the account, choose Download account activity, pick the dates and CSV.'],

function csvRebuild(){
  const st=csvState,t=st.table;
  const prevCat=st.cat||{},manual=st.manual||{};
  const rows=buildImportRows(t,{account:st.account,rules:S.cfg.rules,categories:S.cfg.categories});
  rows.forEach(r=>{if(manual[r.id]&&prevCat[r.id])r.categoryId=prevCat[r.id];r.dup=!!S.expenses[r.id];r.planMatch=r.out&&!r.dup?planMatchFor(r):'';});
  st.rows=rows;st.cat=Object.fromEntries(rows.map(r=>[r.id,r.categoryId]));
}
// A bank charge that a plan line already adds automatically (same amount within ~2%, within 5 days).
function planMatchFor(r){
  const dd=(a,b)=>Math.abs((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
  const months=[...new Set([r.date.slice(0,7),addMonth(r.date.slice(0,7),-1),addMonth(r.date.slice(0,7),1)])];
  for(const m of months)for(const v of planCharges(m,true)){
    if(S.expenses[v.id]&&S.expenses[v.id].planSkip)continue;
    const tol=Math.max(1,v.e.amount*0.02);
    if(Math.abs(v.e.amount-r.amount)<=tol&&dd(v.date,r.date)<=5)return v.line.name;
  }
  return '';
}
function csvDefaultInclude(r){
  const o=csvState.opts;
  if(r.dup)return false;
  if(r.planMatch)return false;
  if(!r.out&&o.skipIn)return false;
  if(r.out&&r.skipReason&&o.skipXfer)return false;
  return true;
}
function csvIncluded(r){return r.dup?false:(r.id in csvState.include?csvState.include[r.id]:csvDefaultInclude(r));}
async function csvPick(f){

  if(!t||!t.body.length){csvState={stage:'error',msg:'Couldn’t find transactions in '+f.name+'. Make sure it’s a CSV download of account activity, with a header row that has a date and an amount.'};render();return;}
  const guess=t.bank||(/schwab/i.test(f.name)?'Charles Schwab':/chase/i.test(f.name)?'Chase':/citi/i.test(f.name)?'Citi':/bread/i.test(f.name)?'Bread Savings':'');
  csvState={stage:'review',fileName:f.name,account:guess,table:t,include:{},cat:{},manual:{},opts:{skipIn:true,skipXfer:true,remember:true},showCols:!t.bank};
  csvRebuild();render();
}
function csvSetCategory(r,cid){
  const st=csvState;st.cat[r.id]=cid;st.manual[r.id]=true;

async function csvRun(){
  const st=csvState;
  const chosen=st.rows.filter(csvIncluded);
  if(!chosen.length){toast('Nothing selected to import.');return;}
  // Save rules for categories the user picked by hand.
  let ruleCount=0;
  if(st.opts.remember){
    S.cfg.rules=S.cfg.rules||[];
    st.rows.forEach(r=>{if(!st.manual[r.id])return;const k=merchantKey(r.desc);if(!k)return;
      const ex=S.cfg.rules.find(x=>x.match===k);
      if(ex){if(ex.categoryId!==st.cat[r.id]){ex.categoryId=st.cat[r.id];ruleCount++;}}
      else{S.cfg.rules.push({id:uid(),match:k,categoryId:st.cat[r.id]});ruleCount++;}});
    if(ruleCount)store.saveSettings();
  }
  const acct=String(st.account||'').trim();
  const items=chosen.map(r=>[r.id,{amount:r2(r.amount),categoryId:st.cat[r.id],date:r.date,note:r.desc,recurring:false,endMonth:null,source:'csv',account:acct,createdAt:Date.now()}]);
  const months=[...new Set(chosen.map(r=>r.date.slice(0,7)))].sort();
  csvState={stage:'running',done:0,total:items.length};render();
  const failed=await store.bulkPut(items,n=>{csvState.done=n;if(view.route==='import')render();});
  csvState={stage:'done',count:items.length-failed,failed,months,rules:ruleCount};
  render();
}

let dlNs=null,backupState=null;
const STANDALONE=(()=>{try{return window.top===window&&!window.claude;}catch(e){return false;}})();

function backupJSON(){
  return JSON.stringify({app:'finance-planning',version:1,exportedAt:new Date().toISOString(),cfg:S.cfg,expenses:S.expenses},null,2);
}
async function doExport(){
  const data=backupJSON(),name='finance-planning-backup-'+today()+'.json';
  if(dlNs){
    try{await dlNs.save({filename:name,data});toast('Backup saved');return;}
    catch(e){if(e&&e.code==='declined'){toast('Download cancelled');return;}if(e&&e.code==='rate_limited'){toast('A download is already waiting. Try again in a moment.');return;}}
  }
  if(STANDALONE){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Backup saved');return;}catch(e){}}

async function copyBackup(){
  const data=backupJSON();
  try{await navigator.clipboard.writeText(data);toast('Backup copied. Paste it into a .json file to keep it.');}
  catch(e){backupState={stage:'copy',data};render();}
}
function readBackup(text){
  let d;try{d=JSON.parse(text);}catch(e){return {error:'That isn’t a valid backup file. It should be the .json file Finance Planning exported.'};}
  if(!d||!['finance-planning','chavos'].includes(d.app)||!d.cfg||typeof d.cfg!=='object')return {error:'That file isn’t a Finance Planning backup.'};
  const ex=d.expenses&&typeof d.expenses==='object'?d.expenses:{};
  return {data:{cfg:d.cfg,expenses:ex},exportedAt:d.exportedAt||''};

async function runRestore(){
  const st=backupState,b=st.backup.data;

  const incoming=Object.entries(b.expenses).filter(([id,e])=>e&&typeof e.date==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id));
  const keep=new Set(incoming.map(([id])=>id));
  const remove=Object.keys(S.expenses).filter(id=>!keep.has(id));
  const total=remove.length+incoming.length;
  backupState={stage:'running',done:0,total};render();
  let failed=await store.bulkDelete(remove,n=>{backupState.done=n;if(view.route==='overview')render();});
  failed+=await store.bulkPut(incoming,n=>{backupState.done=remove.length+n;if(view.route==='overview')render();});
  backupState={stage:'done',msg:'Restored '+(incoming.length)+' expenses and all settings.'+(failed?' '+failed+' changes did not save; restore the file again to retry them.':'')};
  render();
}

// ----- Plan -----
// Everything due from today through the next N-1 days: plan lines with a date, repeating expenses,
// and expenses already entered with a future date.
function upcomingItems(n){
  const t=today(),d0=new Date(t+'T12:00:00'),end=new Date(d0);end.setDate(end.getDate()+n-1);
  const e=end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')+'-'+String(end.getDate()).padStart(2,'0');
  const months=[];for(let m=t.slice(0,7);m<=e.slice(0,7);m=addMonth(m,1))months.push(m);
  const out=[],seen=new Set();
  S.cfg.plan.forEach(l=>{if(l.include===false||l.auto||!(+l.amount>0))return;
    months.forEach(m=>lineDates(l,m).forEach(d=>{if(d<t||d>e)return;const id='plan-'+l.id+'-'+d,x=S.expenses[id];
      if(x&&x.planSkip)return;seen.add(id);
      out.push({date:d,name:x&&x.note||l.name,amount:x?+x.amount:+l.amount,categoryId:x?x.categoryId:l.categoryId,auto:!!l.post,src:'plan'});}));});
  months.forEach(m=>instances(m).forEach(i=>{if(seen.has(i.id)||i.e.fromPlan)return;if(i.date<t||i.date>e)return;
    if(i.e.recurring||i.date>t)out.push({date:i.date,name:i.e.note||catOf(i.e.categoryId).name,amount:+i.e.amount||0,categoryId:i.e.categoryId,auto:false,src:i.e.recurring?'repeat':'entered'});}));
  out.sort((a,b)=>a.date.localeCompare(b.date)||b.amount-a.amount);
  return {items:out,end:e};
}
function dayLabel(d){

  if(d===tm.getFullYear()+'-'+String(tm.getMonth()+1).padStart(2,'0')+'-'+String(tm.getDate()).padStart(2,'0'))return 'Tomorrow';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

// Shared status for anything you save toward: progress, pace from plan lines, and what a date needs.
function fundStatus(target,saved,date,lines,reachedNote){
  const left=Math.max(0,target-saved),pct=target>0?saved/target:0;
  const monthly=lines.reduce((a,l)=>a+C.lineValue(l),0);

  const notes=[];let pill=null,need=0;
  if(target>0&&left<=0){pill=h('span',{class:'pill rec'},'Reached');notes.push(reachedNote);}
  else if(target>0){

      else{need=left/Math.max(1,m);notes.push('Save '+money(need)+' a month to reach it by '+fmtDate(date)+'.');}}
    if(lines.length&&monthly<=0)notes.push('Its plan line has no amount yet.');

      const D=String(lineDay(l)).padStart(2,'0');let m=addMonth(old.slice(0,7),-k*ev);let cand=clampYMD(m+'-'+D);if(cand<start&&ev===1)cand=clampYMD(addMonth(m,1)+'-'+D);nd=cand<start?old:cand;}
    if(nd===old)return;

    for(let m=start.slice(0,7);m<=t.slice(0,7);m=addMonth(m,1))lineDates(L,m).forEach(d=>{if(d<start||d>t||d>=old)return;

    const pw=h('input',{type:'password',id:'acc-pw',autocomplete:'new-password',minlength:'8',placeholder:'At least 8 characters'});
    return h('details',{},h('summary',{style:'cursor:pointer;font-weight:600'},hasEmail?'Change password':'Set a password'),
      h('div',{class:'addrow',style:'margin-top:10px;align-items:flex-end'},h('div',{class:'field',style:'flex:1;min-width:200px'},h('label',{for:'acc-pw'},'New password'),pw),
        h('button',{type:'button',class:'btn',onclick:async()=>{if(pw.value.length<8){toast('Use at least 8 characters.');pw.focus();return;}
          const r=await sb.auth.updateUser({password:pw.value});if(r.error){toast(r.error.message||'Could not save the password.');return;}pw.value='';toast(hasEmail?'Password changed':'Password set');render();}},'Save password')));
  }
  card.append(pwBox,
    h('div',{class:'actions',style:'justify-content:flex-start;flex-wrap:wrap'},
      h('button',{type:'button',class:'btn',onclick:async()=>{await sb.auth.signOut();location.reload();}},'Sign out'),
      h('button',{type:'button',class:'btn ghost',style:'color:var(--danger)',onclick:()=>{
        const typed=h('input',{type:'text',id:'acc-del',autocomplete:'off',placeholder:'DELETE'});
        confirmDialog({title:'Delete your account?',body:'This permanently deletes your account and all your data: settings, paychecks, plan, goals and every expense. Download a backup first if you want a copy.',
          extra:h('div',{class:'field'},h('label',{for:'acc-del'},'Type DELETE to confirm'),typed),
          actions:[{label:'Delete account',kind:'danger',onClick:async()=>{
            if(typed.value.trim().toUpperCase()!=='DELETE'){toast('Type DELETE to confirm.');return;}
            const r=await sb.rpc('delete_my_account');if(r.error){toast('Could not delete the account. Try again.');return;}
            await sb.auth.signOut();location.reload();}}]});}},'Delete account')));
  return card;
}
store.init();
})();
</script>
